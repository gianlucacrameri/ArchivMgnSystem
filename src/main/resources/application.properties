spring.application.name=ArchivMgnSystem
server.port=8080

#MySQL
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/inventory_dp}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update

#JWT
jwt.secret=${JWT_SECRET}


#Max file size (item photos): 10 MB pro Foto, pro Anfrage sind zwei Fotos möglich
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=25MB

#Antworten komprimiert ausliefern (JSON schrumpft auf einen Bruchteil)
server.compression.enabled=true
server.compression.min-response-size=1024
#Login bleibt so viele Tage gültig, danach ist eine neue Anmeldung nötig
jwt.expiration-days=${JWT_EXPIRATION_DAYS:30}

#Erlaubte Adressen des Frontends, mit Komma getrennt (z.B. https://archiv.example.ch).
#Leer = nur localhost und private Netzwerkadressen (lokales Entwickeln/Testen).
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:}

#Verknüpfte Daten in Paketen statt einzeln nachladen (Event- und Antragslisten)
spring.jpa.properties.hibernate.default_batch_fetch_size=50
